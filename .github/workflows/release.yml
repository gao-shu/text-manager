name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows exe
        run: npm run tauri:build

      - name: Rename artifact
        shell: pwsh
        run: |
          Copy-Item `
            "src-tauri/target/release/text-manager.exe" `
            "TextManager-${{ github.ref_name }}-windows-x64.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TextManager ${{ github.ref_name }}
          files: TextManager-${{ github.ref_name }}-windows-x64.exe
          generate_release_notes: false
          body: |
            ## 下载

            请下载 **`TextManager-${{ github.ref_name }}-windows-x64.exe`**，双击即可运行，无需安装。

            > Source code (zip / tar.gz) 为 GitHub 自动生成的源码归档，普通使用无需下载。

            ## 更新说明

            详见仓库 [README](https://github.com/gao-shu/text-manager#textmanager)。
