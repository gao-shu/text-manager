name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows exe
        run: npm run tauri:build

      - name: Rename artifact
        shell: pwsh
        run: |
          Copy-Item `
            "src-tauri/target/release/text-manager.exe" `
            "TextManager-${{ github.ref_name }}-windows-x64.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TextManager ${{ github.ref_name }}
          files: TextManager-${{ github.ref_name }}-windows-x64.exe
          generate_release_notes: true
